<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#6366f1" stop-opacity=".8"/><stop offset="100%" stop-color="#a855f7" stop-opacity=".2"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#fff" stroke-opacity=".04" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern></defs><style>@keyframes pulse{0%{r:4px;opacity:.4}}@keyframes scan{0%{transform:translateY(0);opacity:.2}50%{transform:translateY(280px);opacity:.8}}.subtitle,.tag,.title{font-family:system-ui,-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,sans-serif}.title{font-weight:800;font-size:46px;fill:url(#titleGrad);letter-spacing:-.5px}.subtitle{font-weight:400;font-size:20px;fill:#94a3b8}.tag{font-weight:600;font-size:13px;fill:#e2e8f0}.pulsing-node{animation:pulse 3s infinite alternate ease-in-out}</style><rect width="1200" height="300" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="300" fill="url(#grid)" rx="16"/><circle cx="1100" cy="50" r="180" fill="#6366f1" fill-opacity=".15" filter="blur(40px)"/><circle cx="150" cy="250" r="150" fill="#a855f7" fill-opacity=".12" filter="blur(40px)"/><g stroke="#818cf8" stroke-opacity=".25" stroke-width="1.5"><line x1="850" x2="950" y1="70" y2="120"/><line x1="950" x