<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: url(#titleGrad);
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #94a3b8;
    }
    .tag {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .pulsing-node {
      animation: pulse 3s infinite alternate ease-in-out;
    }
    .scanning-bar {
      animation: scan 4s infinite linear;
    }
    @keyframes pulse {
      0% { r: 4px; opacity: 0.4; }
      100% { r: 9px; opacity: 1; filter: drop-shadow(0 0 8px #818cf8); }
    }
    @keyframes scan {
      0% { transform: translateY(0px); opacity: 0.2; }
      50% { transform: translateY(280px); opacity: 0.8; }
      100% { transform: translateY(0px); opacity: 0.2; }
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="300" rx="16" fill="url(#grid)" />

  <!-- Animated Tech Waves / Glow Spheres -->
  <circle cx="1100" cy="50" r="180" fill="#6366f1" fill-opacity="0.15" filter="blur(40px)" />
  <circle cx="150" cy="250" r="150" fill="#a855f7" fill-opacity="0.12" filter="blur(40px)" />

  <!-- Right Decorative Network Graph (Legal AI Vector Mesh) -->
  <g stroke="#818cf8" stroke-opacity="0.25" stroke-width="1.5">
    <line x1="850" y1="70" x2="950" y2="120" />
    <line x1="950" y1="120" x2="1080" y2="80" />
    <line x1="950" y1="120" x2="910" y2="210" />
    <line x1="910" y1="210" x2="1040" y2="230" />
    <line x1="1080" y1="80" x2="1140" y2="170" />
    <line x1="1040" y1="230" x2="1140" y2="170" />
    <line x1="950" y1="120" x2="1040" y2="230" />
  </g>

  <!-- Nodes in Graph -->
  <circle cx="850" cy="70" r="5" fill="#38bdf8" />
  <circle cx="950" cy="120" r="7" fill="#818cf8" class="pulsing-node" />
  <circle cx="1080" cy="80" r="5" fill="#c084fc" />
  <circle cx="910" cy="210" r="6" fill="#818cf8" />
  <circle cx="1040" cy="230" r="8" fill="#38bdf8" class="pulsing-node" />
  <circle cx="1140" cy="170" r="5" fill="#f43f5e" />

  <!-- Scale of Justice & AI Cyber Icon Overlay -->
  <g transform="translate(740, 85)" fill="none" stroke="url(#titleGrad)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)">
    <!-- Balance Beam -->
    <line x1="20" y1="50" x2="100" y2="50" />
    <line x1="60" y1="20" x2="60" y2="110" />
    <!-- Pillars -->
    <path d="M 45 110 L 75 110" />
    <!-- Left Pan -->
    <line x1="20" y1="50" x2="5" y2="80" />
    <line x1="20" y1="50" x2="35" y2="80" />
    <path d="M 0 80 Q 20 95 40 80 Z" fill="#818cf8" fill-opacity="0.2" />
    <!-- Right Pan -->
    <line x1="100" y1="50" x2="85" y2="80" />
    <line x1="100" y1="50" x2="115" y2="80" />
    <path d="M 80 80 Q 100 95 120 80 Z" fill="#c084fc" fill-opacity="0.2" />
  </g>

  <!-- Left Content Area -->
  <g transform="translate(70, 0)">
    <!-- Badge Pill -->
    <rect x="0" y="45" width="230" height="32" rx="16" fill="url(#accentGrad)" stroke="#818cf8" stroke-opacity="0.4" />
    <text x="15" y="66" class="tag" fill="#38bdf8">⚖️ OPEN LEGAL TECH &amp; AI</text>

    <!-- Main Title -->
    <text x="0" y="125" class="title" filter="url(#glow)">Awesome Legal Research Platform</text>

    <!-- Subtitle -->
    <text x="0" y="165" class="subtitle">Curated Legal AI, Case Law Data, Citators, RAG &amp; Analytics Ecosystem</text>

    <!-- Category Feature Pills -->
    <g transform="translate(0, 195)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="34" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="14" y="22" class="tag" fill="#cbd5e1">🔍 Legal Search</text>

      <!-- Pill 2 -->
      <rect x="142" y="0" width="148" height="34" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="154" y="22" class="tag" fill="#cbd5e1">🤖 Legal RAG / LLM</text>

      <!-- Pill 3 -->
      <rect x="302" y="0" width="140" height="34" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="314" y="22" class="tag" fill="#cbd5e1">📜 Case Law Data</text>

      <!-- Pill 4 -->
      <rect x="454" y="0" width="150" height="34" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="466" y="22" class="tag" fill="#cbd5e1">📊 Legal Analytics</text>
    </g>
  </g>

  <!-- Border Highlight -->
  <rect x="1" y="1" width="1198" height="298" rx="15" fill="none" stroke="url(#titleGrad)" stroke-opacity="0.3" stroke-width="1.5" />
</svg>
